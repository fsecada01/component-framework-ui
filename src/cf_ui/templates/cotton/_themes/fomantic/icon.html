{% load cf_ui %}
<span
  class="ui text{% if size == 'small' %} small{% elif size == 'large' %} large{% endif %}{% if class %} {{ class }}{% endif %}"
  {% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}
  {% cf_ui_render_attrs "icon" attrs %}
>{{ slot }}</span>
