<div class="{{ class }}">
  <label for="{{ name }}"{% if error %} class="is-invalid-label"{% endif %}>{{ label }}</label>
  <select
    class="{% if error %}is-invalid-input{% endif %}{% if input_class %} {{ input_class }}{% endif %}"
    id="{{ name }}"
    name="{{ name }}"
    {% if error %}aria-invalid="true" aria-describedby="{{ name }}-error"{% endif %}
  >
    {% for opt in options %}
      <option
        value="{{ opt.value }}"
        {% if opt.value|stringformat:"s" == value|stringformat:"s" %} selected{% endif %}
      >{{ opt.label }}</option>
    {% endfor %}
  </select>
  {% if error %}
    <span class="form-error is-visible" id="{{ name }}-error">{{ error }}</span>
  {% endif %}
</div>
