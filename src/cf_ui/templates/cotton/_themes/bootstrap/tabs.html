<div class="{{ class }}"
     x-data="cfTabs"
     x-init="initTabs()"
     data-cf-active="{{ active }}">
  <ul class="nav nav-tabs" role="tablist" @keydown="onKeydown($event)">
    {% for tab in tabs %}
    <li class="nav-item" role="presentation">
      <a role="tab"
         data-cf-tab="{{ tab.id }}"
         class="nav-link{% if tab.id == active %} active{% endif %}"
         aria-controls="{{ hx_target }}"
         aria-selected="{% if tab.id == active %}true{% else %}false{% endif %}"
         tabindex="{% if tab.id == active or not active and forloop.first %}0{% else %}-1{% endif %}"
         :class="{ 'active': active === '{{ tab.id }}' }"
         :aria-selected="active === '{{ tab.id }}'"
         :tabindex="tabIndexFor('{{ tab.id }}')"
         @click.prevent="setActive('{{ tab.id }}')"
         hx-get="{{ tab.url }}"
         hx-target="#{{ hx_target }}">{{ tab.id }}</a>
    </li>
    {% endfor %}
  </ul>
  <div id="{{ hx_target }}" role="tabpanel">{{ slot }}</div>
</div>
