name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      # Catches a malformed README or broken metadata before anything is
      # uploaded — a bad upload cannot be replaced, only yanked.
      - name: Validate distributions
        run: uvx twine check dist/*

      # The tag is the release's identity; if it disagrees with the version in
      # pyproject.toml the wheel would be published under a name the tag does
      # not describe. Fail here rather than after upload.
      - name: Tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          echo "pyproject: $declared / tag: $tagged"
          test "$declared" = "$tagged"

      # cf-ui is templates. They live inside the package so hatchling picks
      # them up with no explicit include, which is exactly what makes a
      # regression here quiet: a packaging change that drops them produces a
      # wheel that installs cleanly, imports cleanly, and renders nothing.
      #
      # This compares the wheel against the *source tree* rather than against
      # hardcoded counts. The counts were the original design and they went
      # stale the moment the primitives layer landed: the thresholds said
      # ">= 14 per template set" while the real figures had grown to 21
      # wrappers and 105 partials, so a regression dropping all seven
      # primitives from all five themes would have left exactly 14 and passed.
      # Deriving the expectation cannot drift, and it fails on one missing
      # file instead of only on a missing fourteen.
      - name: Wheel must contain every shipped template and asset
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          SRC = pathlib.Path("src")
          SHIPPED_SUFFIXES = {".jinja", ".html", ".js", ".mjs", ".css", ".json"}

          # Wheel entries are src-relative (`cf_ui/templates/...`), so the
          # relative path is directly comparable with no rewriting.
          expected = {
              p.relative_to(SRC).as_posix()
              for p in SRC.rglob("*")
              if p.is_file()
              and p.suffix in SHIPPED_SUFFIXES
              and ("templates" in p.parts or "static" in p.parts)
          }

          # The guard this replaces could not fail once its thresholds went
          # stale. This one has the same hazard in a different place: if the
          # source layout moves, `expected` silently becomes empty and every
          # wheel passes. So assert the scan found something first — the
          # floor is deliberately far below the real figure (237 at 0.3.0),
          # low enough never to need editing, high enough that an empty or
          # near-empty scan is caught.
          if len(expected) < 100:
              sys.exit(
                  f"only {len(expected)} shipped files found under {SRC}/ — the "
                  f"scan itself is broken, so this check proves nothing. Fix the "
                  f"scan before trusting a pass."
              )

          wheel = next(iter(sorted(pathlib.Path("dist").glob("*.whl"))))
          names = set(zipfile.ZipFile(wheel).namelist())
          print(f"{wheel.name}: {len(names)} entries / {len(expected)} expected from {SRC}/")

          missing = sorted(expected - names)
          if missing:
              shown = "\n  ".join(missing[:20])
              more = f"\n  ... and {len(missing) - 20} more" if len(missing) > 20 else ""
              sys.exit(f"wheel is missing {len(missing)} shipped file(s):\n  {shown}{more}")

          print(f"ok: all {len(expected)} shipped templates and assets present")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Gates the upload behind a named environment, so protection rules can
    # require a review before anything reaches PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/cf-ui
    permissions:
      # Required for trusted publishing: the job mints a short-lived OIDC
      # token that PyPI exchanges for an upload token. No API token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
