[project]
name = "cf-ui"
version = "0.2.0"
description = "CSS framework UI kit for component-framework — Bulma, Bootstrap, Foundation, Fomantic, DaisyUI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Francis Secada", email = "francis.secada@gmail.com"}]
keywords = ["components", "bulma", "htmx", "alpinejs", "django", "fastapi", "litestar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    # >=0.6: 0.6.0 is the only final release on PyPI. 0.4.x and 0.5.x exist
    # only as `b0` pre-release tags, so `>=0.4` claimed a compatibility range
    # that was never published and never tested (#50).
    "component-framework>=0.6",
    "pydantic>=2.0",
]

[project.optional-dependencies]
bulma = []
bootstrap = []
foundation = []
fomantic = []
daisy = []
all = [
    "cf-ui[bulma,bootstrap,foundation,fomantic,daisy,django,fastapi,litestar]",
]
django = [
    "django>=4.2",
    # 2.0, not 0.9: every cotton wrapper here uses <c-vars>, and <c-props>
    # was renamed to <c-vars> in django-cotton 0.9.6 — so a >=0.9 floor
    # resolved 0.9.0-0.9.5, which install cleanly and then drop every prop.
    # The floor sits at the major series actually tested rather than at the
    # bare syntax minimum (#47).
    "django-cotton>=2.0",
]
fastapi = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinjax>=0.41",
    "python-multipart>=0.0.5",
]
litestar = [
    "litestar>=2.0",
    "jinja2>=3.1",
    # cf-ui installs a JinjaX catalog onto Litestar's Jinja2 environment so
    # <Cf:Card> renders there too (#42). Matches component-framework's own
    # litestar extra, which has always listed jinjax.
    "jinjax>=0.41",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "cf-ui[django,fastapi,litestar,docs]",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-django>=4.5",
    "pytest-playwright>=0.4",
    "httpx>=0.26",
    "jinja2>=3.1",
    "ruff>=0.1",
    "ty>=0.0.18",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/fsecada01/component-framework-ui"
Repository = "https://github.com/fsecada01/component-framework-ui"
Issues = "https://github.com/fsecada01/component-framework-ui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_ui"]

[tool.hatch.build]
include = [
    "src/cf_ui/**/*.py",
    "src/cf_ui/templates/**",
    "src/cf_ui/static/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
# Stated explicitly because the pinned pre-commit hook (ruff v0.3.0) and the
# ruff CI resolves from `dev` (0.16.x) infer this differently for a src/
# layout: the older version treats `cf_ui` as third-party, the newer as
# first-party, so each reverts the other's import fix and `prek` can pass
# while CI fails I001 on the same file.
known-first-party = ["cf_ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
